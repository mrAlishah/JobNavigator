# Local override for Alish's isolated JobNavigator instance.
# Use only together with docker-compose.yml and project name jobnavigator-alish.
# The named volumes are therefore jobnavigator-alish_* and cannot mix with Elsa's.
services:
  db:
    ports: !override
      - "127.0.0.1:15432:5432"

  backend:
    ports: !override
      - "127.0.0.1:18000:8000"
    volumes:
      - ./backups-alish:/app/backups
      - ./backend/.linkedin_api-alish:/root/.linkedin_api
      # Git worktree checkout: ./.git is a file pointing at a host path the container cannot see.
      # Mount the main clone's .git read-only and point JN_GIT_DIR at this worktree's folder in it
      # (both set in .env, see misc/Docker-setup.md). Unset = plain clone: a second mount of ./.git.
      - ${JN_GIT_COMMON_DIR:-./.git}:/app/.git-common:ro

  frontend:
    # Diagnostic only. Use Caddy at http://localhost:8082 for the app.
    ports: !override
      - "127.0.0.1:13000:80"

  caddy:
    ports: !override
      - "127.0.0.1:8082:80"
      - "127.0.0.1:8443:443"
  adminer:
    image: adminer:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:18080:8080"
    depends_on:
      - db