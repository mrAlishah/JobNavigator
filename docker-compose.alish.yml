# Local override for Alish's isolated JobNavigator instance.
# Use only together with docker-compose.yml and project name jobnavigator-alish.
# The named volumes are therefore jobnavigator-alish_* and cannot mix with Elsa's.
services:
  db:
    ports: !override
      - "127.0.0.1:15432:5432"

  backend:
    ports: !override
      - "127.0.0.1:18000:8000"
    volumes:
      - ./backups-alish:/app/backups
      - ./backend/.linkedin_api-alish:/root/.linkedin_api

  frontend:
    # Diagnostic only. Use Caddy at http://alish.localhost:8080 for the app.
    ports: !override
      - "127.0.0.1:13000:80"

  caddy:
    ports: !override
      - "127.0.0.1:8082:80"
      - "127.0.0.1:8443:443"
  adminer:
    image: adminer:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:18080:8080"
    depends_on:
      - db