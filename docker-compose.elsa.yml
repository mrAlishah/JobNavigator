# Local override for Elsa's isolated JobNavigator instance.
# Use only together with docker-compose.yml and project name jobnavigator-elsa.
# The named volumes are therefore jobnavigator-elsa_* and cannot mix with Alish's.
services:
  db:
    ports: !override
      - "0.0.0.0:15433:5432"

  backend:
    ports: !override
      - "0.0.0.0:18001:8000"
    volumes:
      - ./backups-elsa:/app/backups
      - ./backend/.linkedin_api-elsa:/root/.linkedin_api
      # Git worktree checkout: ./.git is a file pointing at a host path the container cannot see.
      # Mount the main clone's .git read-only and point JN_GIT_DIR at this worktree's folder in it
      # (both set in .env, see misc/Docker-setup.md). Unset = plain clone: a second mount of ./.git.
      - ${JN_GIT_COMMON_DIR:-./.git}:/app/.git-common:ro

  frontend:
    # Diagnostic only. Use Caddy at http://192.168.178.33:8081 for the app.
    ports: !override
      - "0.0.0.0:13001:80"

  caddy:
    ports: !override
      - "0.0.0.0:8081:80"
      - "0.0.0.0:8444:443"
  adminer:
    image: adminer:latest
    restart: unless-stopped
    ports:
      - "0.0.0.0:18081:8080"
    depends_on:
      - db