services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    environment:
      POSTGRES_USER: jobnavigator
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: jobnavigator
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobnavigator"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    # Prebuilt on every release (ghcr.io, .github/workflows/images.yml): `docker compose pull`
    # skips the Chromium build. `docker compose up --build` still builds from source.
    image: ghcr.io/vesaias/jobnavigator-backend:${JN_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    env_file: .env
    environment:
      DATABASE_URL: postgresql://jobnavigator:${POSTGRES_PASSWORD:-password}@db:5432/jobnavigator
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
    ports:
      - "127.0.0.1:8000:8000"   # everything external goes through Caddy on :80; the raw API stays on loopback
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app/backend
      - ./backups:/app/backups
      - ./backend/.linkedin_api:/root/.linkedin_api
      - codex_auth:/root/.codex

  frontend:
    image: ghcr.io/vesaias/jobnavigator-frontend:${JN_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile.frontend
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    ports:
      - "127.0.0.1:3000:80"   # the frontend container alone; everything external goes through Caddy
    depends_on:
      - backend

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend

volumes:
  pgdata:
  caddy_data:
  caddy_config:
  codex_auth:
